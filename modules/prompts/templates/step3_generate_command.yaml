description: "Generate a single executable command for one technique node, using knowledge-base examples and predecessor outputs"

prompt: |
  You are a penetration testing expert writing a single executable {os_type} command.

  # Step
  - Name: {node_name}
  - Description: {description}
  - Tactic: {tactic}
  - Technique: {technique_id} ({technique_name})

  # Environment Details for This Step
  {environment_specific}

  # Full Target Environment
  {environment_description}

  # Commands Already Generated by Preceding Steps
  {predecessor_commands}

  # Example Commands for This Technique
  {example_commands}

  # Task

  Write ONE single-line command that performs this step in the target environment's shell.

  1) Reflect actual IP/URL/credentials/params/filenames from the environment details above
  2) If this step consumes output from a preceding step (e.g., a file path, account name), match that exact value
  3) Chain multiple actions in one line with `;` if needed
  4) Prefer built-in OS/shell tools; use the example commands above as a style/pattern reference, not literal text to copy
  5) If a real command is impossible, output a simulation stub (e.g., echo) — never leave it empty
  6) Follow any shell-specific constraints noted in the environment description

  **Output ONLY the command. No explanation, no code fences, no backticks.**
